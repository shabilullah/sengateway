[package]
name = "sengateway"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
aes-gcm = "0.10"
askama = "0.14"
axum = { version = "0.8", features = ["form", "macros", "query"] }
base64 = "0.22"
hex = "0.4"
http = "1"
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "time"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros", "serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace"] }
tower-sessions = { version = "0.14", features = ["signed"] }
tower-sessions-sqlx-store = { version = "0.15", features = ["sqlite"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
wiremock = "0.6"
