services:
  app:
    image: ${APP_IMAGE:-ghcr.io/shabilullah/sengateway:latest}
    pull_policy: always
    restart: unless-stopped
    init: true
    environment:
      PUBLIC_BASE_URL: "https://${PORTAL_HOSTNAME:?Set PORTAL_HOSTNAME}"
      DATABASE_URL: "sqlite:/data/gateway.db?mode=rwc"
      SENGATEWAY_SECRET_DIR: /data
      COOKIE_SECURE: "true"
      TRUSTED_PROXY_IP: ${PROXY_IPV4:-172.28.0.3}
      RUST_LOG: sengateway=info
    volumes:
      - app-data:/data
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      portal:
        ipv4_address: ${APP_IPV4:-172.28.0.2}
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: ${CADDY_IMAGE:-ghcr.io/shabilullah/sengateway-caddy:latest}
    pull_policy: always
    restart: unless-stopped
    init: true
    depends_on:
      app:
        condition: service_healthy
    environment:
      PORTAL_HOSTNAME: ${PORTAL_HOSTNAME:?Set PORTAL_HOSTNAME}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?Set restricted Cloudflare DNS token}
      CADDY_UPSTREAM: app:8080
    ports:
      - "${ORIGIN_BIND_IP:?Set private LAN ORIGIN_BIND_IP}:80:80"
      - "${ORIGIN_BIND_IP:?Set private LAN ORIGIN_BIND_IP}:443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      portal:
        ipv4_address: ${PROXY_IPV4:-172.28.0.3}
    logging:
      options:
        max-size: "10m"
        max-file: "3"


networks:
  portal:
    driver: bridge
    ipam:
      config:
        - subnet: ${PORTAL_SUBNET:-172.28.0.0/24}

volumes:
  app-data:
  caddy-data:
  caddy-config:
